<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Структура блоков с текстом</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Первый блок - прижат к левой границе -->
    <div class="block">
        <div class="text">
            Текст1 Текст1
        </div>
    </div>

    <!-- Второй блок - с отступом 200px -->
    <div class="block2">
        <div class="text">
            Текст2 Текст2
        </div>
    </div>

    <!-- Третий блок - прижат к левой границе -->
    <div class="block">
        <div class="text2">
            Текст3 
            Текст3 
        </div>
    </div>

    <!-- Четвертый блок - с отступом 200px -->
    <div class="block2">
        <div class="text2">
            Текст4 
            Текст4 
        </div>
    </div>

    <!-- Дополнительные блоки для демонстрации -->
    <div class="block">
        <div class="text">
            Дополнительный текст слева
        </div>
    </div>

    <div class="block2">
        <div class="text2">
            Дополнительный текст справа
        </div>
    </div>
</body>
</html>
