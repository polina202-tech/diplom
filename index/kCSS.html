<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание по HTML и CSS</title>
    <style>
        /* 1) Фон страницы - картинка только сверху, повторяется по горизонтали */
        body {
            background-image: url('background-top.jpg'); /* замените на путь к вашей картинке */
            background-repeat: repeat-x; /* повторение только по горизонтали */
            background-position: top; /* расположение сверху */
            margin: 0;
            padding: 0;
        }

        /* 2) Изображение в центре web-страницы */
        .centered-image {
            display: block;
            margin: 50px auto;
            max-width: 80%;
            height: auto;
        }

        /* 3a) Стилевой класс для желтого фона и фонового изображения слева */
        .yellow-background {
            background-color: yellow;
            background-image: url('left-background.jpg'); /* замените на путь к вашей картинке */
            background-repeat: repeat-y; /* повторение сверху вниз */
            background-position: left;
            padding: 20px;
            min-height: 400px;
        }

        /* 3b) Переопределение тега h1 - красный текст с синим фоном */
        h1 {
            color: red;
            background-color: blue;
            padding: 10px;
            margin: 20px 0;
        }

        /* 3c) Переопределение тега p - зеленый текст */
        p {
            color: green;
            line-height: 1.6;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <!-- Основной контейнер с желтым фоном и фоновым изображением слева -->
    <div class="yellow-background">
</body>
</html>
